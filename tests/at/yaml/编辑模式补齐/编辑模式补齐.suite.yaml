name: 编辑模式补齐_suite
app: deepin-image-viewer
module: 编辑模式补齐
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: case_2033693_s1
  name: 编辑模式-按钮点击进入编辑模式
  description: 进入编辑模式并验证编辑工具按钮可访问
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+shift+e
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Pen (P)
  - step_type: assert
    action: assert_element
    selector:
      name: Save Copy
  - step_type: action
    action: element_action
    selector:
      name: Close Edit
    do: click
    wait: 1.0
- id: case_2033695_s1
  name: 编辑模式-ESC快捷键退出编辑
  description: 进入编辑模式后按ESC退出，验证应用保持运行
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+shift+e
    wait: 2.0
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_2033697_s1
  name: 编辑模式-按钮点击退出编辑
  description: 进入编辑模式后点击关闭编辑按钮退出
  steps:
