name: 重命名_suite
app: deepin-image-viewer
module: 重命名
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_chongmingming_002_s1
  name: 重命名-右键菜单重命名
  description: 右键图片选择重命名，验证重命名输入框出现后键盘取消关闭
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Rename
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: New file name
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
  - step_type: action
    action: keyboard_press
    key: tab
  - step_type: action
    action: keyboard_press
    key: tab
  - step_type: action
    action: keyboard_press
    key: return
    wait: 1.0
- id: suite_chongmingming_001_s1
  name: 重命名-快捷键F2重命名
  description: 按F2打开重命名对话框，验证输入框出现后键盘取消关闭（放在末尾避免残留影响）
  steps:
  - step_type: action
    action: keyboard_press
    key: f2
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: New file name
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
  - step_type: action
    action: keyboard_press
    key: tab
  - step_type: action
    action: keyboard_press
    key: tab
  - step_type: action
    action: keyboard_press
    key: return
    wait: 1.0
teardown:
- action: session_stop
