name: 主菜单_suite
app: deepin-image-viewer
module: 主菜单
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_zhucaidan_001_s1
  name: 主菜单-帮助
  description: 按F1打开帮助窗口，验证应用正常运行
  steps:
  - step_type: action
    action: keyboard_press
    key: f1
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
